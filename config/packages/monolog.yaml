monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - bot_message
        - bot_command

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!bot_message", "!bot_command"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console", "!bot_message", "!bot_command"]
            bot_message:
                type: stream
#                type: rotating_file
#                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_message/bot_message.log"
                level: info
                channels: [bot_message]
            bot_command:
                type: stream
#                type: rotating_file
#                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_command/bot_command.log"
                level: info
                channels: [ bot_command ]
when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event", "!bot_message", "!bot_command"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            bot_message:
                type: stream
#                type: rotating_file
#                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_message/bot_message.log"
                level: info
                channels: [ bot_message ]
            bot_command:
                type: stream
#                type: rotating_file
#                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_command/bot_command.log"
                level: info
                channels: [ bot_command ]

when@prod:
    monolog:
        handlers:
            main:
#                type: stream
                type: rotating_file
                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.log/%kernel.environment%.log"
                level: debug
                channels: [ "!event", "!bot_message", "!bot_command" ]
#            main:
#                type: fingers_crossed
#                action_level: error
#                handler: nested
#                excluded_http_codes: [404, 405]
#                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
#            nested:
#                type: stream
#                path: php://stderr
#                level: debug
#                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!bot_message", "!bot_command"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            bot_message:
#                type: stream
                type: rotating_file
                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_message/bot_message.log"
                level: info
                channels: [bot_message]
            bot_command:
#                type: stream
                type: rotating_file
                max_files: 365
                path: "%kernel.logs_dir%/%kernel.environment%.bot_command/bot_command.log"
                level: info
                channels: [bot_command]
