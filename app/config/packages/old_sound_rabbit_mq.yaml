old_sound_rabbit_mq:
    connections:
        default:
            host: 'rabbit-mq'
            port: 5672
            user: 'user'
            password: 'password'
    producers:
        # use 'old_sound_rabbit_mq.task_producer' service to send data.
        request:
            connection:       default
            exchange_options: { name: 'request', type: direct }
    consumers:
        statement:
            connection:       default
            exchange_options: { name: 'request', type: direct }
            queue_options:    { name: 'request'}
            callback:         App\Infrastructure\Consumer\RequestConsumer
