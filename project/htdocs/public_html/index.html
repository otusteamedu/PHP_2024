<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        /* Основной контейнер */
        body {
            display: flex;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Левая часть (чат) */
        #chat-container {
            flex: 3; /* Занимает 3/4 ширины */
            border-right: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            height: 100vh;
        }

        /* Правая часть (список пользователей) */
        #users-container {
            flex: 1; /* Занимает 1/4 ширины */
            padding: 10px;
            background-color: #f9f9f9;
            overflow-y: auto;
            height: 100vh;
        }

        /* Контейнер для сообщений */
        #messages {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Расстояние между сообщениями */
        }

        /* Сообщения в чате */
        .message {
            max-width: 70%; /* Ограничение ширины сообщения */
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
            align-self: flex-start; /* Все сообщения прилипают к левому краю */
            background-color: #e9ecef; /* Единый фон для всех сообщений */
        }

        /* Список пользователей */
        #users-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #users-list li {
            padding: 5px;
            margin-bottom: 5px;
            background-color: #e9ecef;
            border-radius: 4px;
        }

        /* Ввод сообщений */
        #input-container {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 75%; /* Соответствует ширине чата */
            background-color: #fff;
            padding: 10px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #sendButton {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #sendButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<!-- Левая часть: Чат -->
<div id="chat-container">
    <div id="messages"></div>
    <div id="input-container">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- Правая часть: Список пользователей -->
<div id="users-container">
    <h3>Online Users</h3>
    <ul id="users-list"></ul>
</div>

<script>
    // Запрос логина при загрузке страницы
    const username = prompt("Enter your username:");
    if (!username) {
        alert("Username is required to join the chat.");
        window.location.reload(); // Перезагрузка страницы, если пользователь не ввел имя
    }

    // Подключение к WebSocket-серверу
    const ws = new WebSocket('ws://127.0.0.1:38081'); // Для локального запуска
    const messagesDiv = document.getElementById('messages');
    const usersList = document.getElementById('users-list');

    // Добавление нового сообщения в интерфейс
    function addMessage(sender, message) {
        const messageElement = document.createElement('div');
        messageElement.className = 'message';
        messageElement.textContent = `${sender}: ${message}`;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // Прокрутка вниз
    }

    // Обновление списка пользователей
    function updateUsers(users) {
        usersList.innerHTML = ''; // Очищаем список
        users.forEach(user => {
            const userElement = document.createElement('li');
            userElement.textContent = user;
            usersList.appendChild(userElement);
        });
    }

    ws.onopen = () => {
        console.log('Connected to the server');
        ws.send(JSON.stringify({ type: 'join', username })); // Отправляем имя пользователя при подключении
    };

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'message') {
            addMessage(data.sender, data.message); // Добавляем сообщение в чат
        } else if (data.type === 'users') {
            updateUsers(data.users); // Обновляем список пользователей
        }
    };

    ws.onclose = () => {
        console.log('Disconnected from the server');
    };

    // Отправка сообщения
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (message) {
            ws.send(JSON.stringify({
                type: 'message',
                sender: username,
                message: message
            }));
            input.value = ''; // Очищаем поле ввода
        }
    }
</script>
</body>
</html>
