networks:
  app-network:
    driver: bridge

services:
  nginx:
    image: nginx:latest
    container_name: web-server
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Mounting app volume
      - ./src:/var/www/html
    links:
      - php-fpm
    ports:
      - "80:80"
    networks:
      - app-network

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: php-fpm
    restart: unless-stopped
    volumes:
      # Mounting app volume
      - ./src:/var/www/html
    depends_on:
      - rabbitmq
      - php-worker
      # - mysql
      # - memcached
    networks:
      - app-network

  php-worker:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: php-worker
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      - rabbitmq
    command: php app/Infrastructure/Workers/Worker.php
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBIT_WEB_PORT:-15672}:15672"
      - "${RABBIT_PORT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-developer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network


