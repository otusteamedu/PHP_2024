name: hw29
services:
  
  db:
    image: mysql:latest
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    container_name: ${MYSQL_NAME}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    expose:
      - 3306
    ports:
      - "33060:3306"
    networks:
      - app-network       
  
  rabbitmq:
    image: rabbitmq:3.10.7-management
    hostname: rabbitmq
    restart: always
    container_name: rabbitmq
    ports:
      - 15672:15672
    expose:
      - 5672
    networks:
      - app-network  

  #контейнер с Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: app/nginx
    restart: always
    container_name: ${WEBSERVER_NAME}
    # проброс портов
    ports:
      - "80:80"
    volumes:
       - ./src:/data/mysite.local/src
       - ./vendor:/data/mysite.local/vendor
       - ./php-socket:/var/run/php-fpm.sock
    networks:
      - app-network

  #Контейнер с PHP-FPM, назовём его app
  app:
    # Если нет секции build, то система будет искать образ в репозиториях
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: app/php # имя будущего образа
    container_name: ${APP_NAME} # имя контейнера после запуска
    depends_on:
      - "db"
      - rabbitmq 
    volumes:
       - ./src:/data/mysite.local/src
       - ./vendor:/data/mysite.local/vendor
       - ./php-socket:/var/run/php-fpm.sock
    # мы можем создать для контейнеров внутреннюю сеть
    networks:
      - app-network 
      

#Docker Networks
networks:
  app-network:
    driver: bridge

#Volumes
volumes:
  db_data:
  cache:
