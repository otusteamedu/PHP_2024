version: '3'

services:

    postgres:
        image: postgres:15
        ports:
            - 15432:5432
        container_name: 'postgresql'
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: 'otus'
            POSTGRES_USER: 'user'
            POSTGRES_PASSWORD: 'password'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data


volumes:
    dump:
    postgresql:
