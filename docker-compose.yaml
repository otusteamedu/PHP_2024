services:
  
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    volumes:
      - ./app:/app
      - ./logs/nginx:/var/log/nginx/
    ports:
      - 80:80
    networks:
      - app-network
  
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: php
    container_name: php
    volumes:
       - ./app:/app
       - ./logs/php.log:/var/log/fpm-php.www.log
    restart: always
    networks:
      - app-network
  
  postgres:
    container_name: postgres
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./:/app
    ports:
      - 5432:5432
    networks:
      - app-network
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

networks:
  app-network:
    driver: bridge