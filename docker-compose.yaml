#https://www.doctrine-project.org/projects/doctrine-orm/en/current/tutorials/getting-started.html
name: hw16
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: hw16-nginx
    ports:
      - "80:80"
    volumes:
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

  db:
    image: mysql:latest
    container_name: hw16-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=otus
      - MYSQL_DATABASE=otus
      - MYSQL_USER=otus
      - MYSQL_PASSWORD=otus
    ports:
      - "33060:3306" 
    networks:
      - app-network

  app:
    image: php:8.3-fpm
    build:
       context: ./app
       dockerfile: Dockerfile
    container_name: hw16-app
    depends_on:
      - db
    volumes: 
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

#Docker Networks
networks:
  app-network:
    driver: bridge