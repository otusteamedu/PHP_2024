#https://stackoverflow.com/questions/42360356/docker-redis-connection-refused
name: hw14
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: hw14-nginx
    ports:
      - "80:80"
    volumes:
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: hw14-redis
    restart: always
    ports:
      - 6379:6379
    command: redis-server --save 20 1 --loglevel warning 
    networks:
      - app-network

  app:
    image: php:8.3-fpm
    container_name: hw14-app
    depends_on:
      - redis
    volumes: 
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

#Docker Networks
networks:
  app-network:
    driver: bridge