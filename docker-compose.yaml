name: hw14
services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: hw14-nginx
    # проброс портов
    ports:
      - "80:80"
    volumes:
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

  cache:
    image: redis:latest
    container_name: hw14-redis
    restart: always
    ports:
      - 6379:6379
    #command: redis-server --save 20 1 --loglevel warning --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    networks:
      - app-network

  app:
    image: php:8.2-fpm
    container_name: hw14-app
    #depends_on:
    #  - cache
    volumes: 
       - ./public:/data/mysite.local/public
       - ./vendor:/data/mysite.local/vendor
       - ./src:/data/mysite.local/src
    networks:
      - app-network

#Docker Networks
networks:
  app-network:
    driver: bridge