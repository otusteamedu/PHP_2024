services:
  
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    volumes:
      - ./app:/app
      - ./logs/nginx:/var/log/nginx/
    ports:
      - 80:80
    networks:
      - app-network
  
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: php
    container_name: php
    volumes:
       - ./app:/app
       - ./logs/php.log:/var/log/fpm-php.www.log
    restart: always
    networks:
      - app-network
  
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elastic
    restart: always
    ports:
      - 9200:9200
    networks:
      - app-network
    env_file: .env

networks:
  app-network:
    driver: bridge