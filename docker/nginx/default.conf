server {
    listen 0.0.0.0:80;
    server_name localhost shilyaeff.ru www.shilyaeff.ru;
    root /app/public;
    index index.php index.html;

    # 🔹 Отдаём статические ресурсы React SPA (JS, CSS и пр.)
    location /static/ {
        root /app/public/frontend;
        try_files $uri $uri/ =404;
    }

    # 🔹 React SPA fallback (всё, что не начинается с /api и не файл — это SPA)
    location / {
        root /app/public/frontend;
        try_files $uri /index.html;
    }

    # 🔹 Отдаём остальные ассеты (например, favicon, manifest и пр.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webmanifest|woff2?|ttf)$ {
        root /app/public/frontend;
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    # 🔹 Прокси API-запросов в PHP
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # 🌐 SPA fallback для React
    location /public/frontend/ {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
}
