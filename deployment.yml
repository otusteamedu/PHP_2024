stages:
  - build
  - deploy

variables:
  DEPLOY_SERVER: "91.107.126.239"
  DEPLOY_USER: "CICDrunner"
  REPO_CONFIGS: "git@github.com:mitzury/bogdi-configs.git"
  DOCKER_IMAGE: "my-app:$CI_COMMIT_REF_SLUG"

build:
  stage: build
  script:
    - echo "Building the application..."
    - docker build -t $DOCKER_IMAGE .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $DOCKER_IMAGE

deploy:
  stage: deploy
  environment:
    name: production
    url: http://bogdi.ru
  before_script:
    - mkdir -p configs
    - git clone $REPO_CONFIGS configs
  script:
    - scp -o StrictHostKeyChecking=no -r configs/nginx.conf $DEPLOY_USER@$DEPLOY_SERVER:/tmp/nginx.conf
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER <<EOF
        set -e

        CURRENT_CONTAINER=\$(docker ps --filter "name=MyNginx" --format "{{.Names}}" | head -n1)
        NEW_CONTAINER="MyNginxNew"

        echo "Pulling new version..."
        docker pull $DOCKER_IMAGE

        echo "Starting new version in the background..."
        docker run -d --name \$NEW_CONTAINER -p 8081:80 $DOCKER_IMAGE

        echo "Waiting for new container to be healthy..."
        echo "Reloading Nginx to point to the new container..."
        sudo cp /tmp/nginx.conf /etc/nginx/nginx.conf
        sudo nginx -t && sudo nginx -s reload

        echo "Stopping old container..."
        if [ -n "\$CURRENT_CONTAINER" ]; then
          docker stop \$CURRENT_CONTAINER
          docker rm \$CURRENT_CONTAINER
        fi

        echo "Renaming new container to the main name..."
        docker rename \$NEW_CONTAINER MyNginx
EOF
  only:
    - main
