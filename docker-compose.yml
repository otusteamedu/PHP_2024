version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: deferred_app
    volumes:
      - ./app:/var/www
    depends_on:
      - db
      - rabbitmq

  db:
    image: postgres:15
    container_name: deferred_db
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_pass
      - POSTGRES_DB=app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: deferred_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  nginx:
    image: nginx:latest
    container_name: deferred_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./app/public:/var/www/public
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  db_data: