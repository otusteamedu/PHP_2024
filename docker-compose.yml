services:
  nginx:
    container_name: MyNginx
    ports:
      - "80:80"
    build:
      context: ./context/nginx
      dockerfile: DockerFile
    networks:
      - devweb
    volumes:
      - ./project/htdocs/:/var/www/html/
      - ./logs/nginx:/var/log/nginx/
    depends_on:
      - php

  php:
    container_name: MyPhp
    build:
      context: ./context/php
      dockerfile: DockerFile
    volumes:
      - ./project/htdocs/:/var/www/html/
      - ./logs/php.log:/var/log/fpm-php.www.log
    networks:
      - devweb

  composer:
    build:
      context: ./context/composer
      dockerfile: Dockerfile
    container_name: MyComposer
    volumes:
      - ./project/htdocs/:/var/www/html
    networks:
      - devweb
    depends_on:
      - php

  rabbitmq:
    build:
      context: ./context/RabbitMQ
      dockerfile: DockerFile
    container_name: MyRabbitMQ
    ports:
      - "15672:15672"
    volumes:
      - ./data/RabbitMQ:/var/lib/rabbitmq
    restart: always
    networks:
      - devweb

networks:
  devweb:
    name: devweb
    driver: bridge



