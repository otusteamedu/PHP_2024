version: '3'

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: otus-hw20/nginx
    container_name: otus-hw20-nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
    networks:
      - otus-hw20-network

  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: otus-hw20/php
    container_name: app
    volumes:
      - ./:/var/www
    networks:
      - otus-hw20-network

  redis:
    image: redis:latest
    container_name: otus-hw20-redis
    ports:
      - "6379:6379"
    networks:
      - otus-hw20-network

networks:
  otus-hw20-network:
    driver: bridge
