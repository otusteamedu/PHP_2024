services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./app/public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: media-monitoring-app
    ports:
      - "9000:9000"
    volumes:
      - ./app:/var/www # Монтируем текущую директорию в /var/www/html
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:latest
    container_name: media-monitoring-db
    environment:
      POSTGRES_DB: media_monitoring
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: