services:
  nginx:
    image: nginx:latest
    container_name: ${PROJECT_PREFIX}-nginx
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - .:/var/www/otus-hw-21/public
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf

  php-fpm:
    container_name: ${PROJECT_PREFIX}-php-fpm
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    volumes:
      - .:/var/www/otus-hw-21

  postgres:
    container_name: ${PROJECT_PREFIX}-postgres
    image: postgres:${POSTGRES_VERSION:-15}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data

  rabbit-mq:
    container_name: ${PROJECT_PREFIX}-rabbit-mq
    image: rabbitmq:4-management
    hostname: rabbit-mq # required to persist server state
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD}

volumes:
  db_data:
