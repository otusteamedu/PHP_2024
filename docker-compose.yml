version: '3'

services:
  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: otus-hw8/php
    container_name: app
    volumes:
      - ./app:/var/www
    networks:
      - otus-hw8-network

volumes:
  pg-data:
    external: false

networks:
  otus-hw8-network:
    driver: bridge
