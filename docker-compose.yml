version: '3'

services:

  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: otus-hw15/php
    container_name: app
    volumes:
      - ./app:/var/www
    networks:
      - otus-hw15-network

  redis:
    image: redis:latest
    container_name: otus-hw15-redis
    ports:
      - "6379:6379"
    networks:
      - otus-hw15-network

networks:
  otus-hw15-network:
    driver: bridge
