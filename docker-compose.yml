services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: otus-shop/php
    container_name: php
    volumes:
      - ./code:/data/mysite.local
    depends_on:
      - postgres
    networks:
      - app-network
    tty: true
    env_file: .env

  postgres:
    image: postgres
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}
    volumes:
      - ./local_pgdata:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  local_pgdata: