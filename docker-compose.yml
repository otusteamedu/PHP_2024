services:
  nginx:
    build:
      context: ./builds/nginx
      dockerfile: Dockerfile
    image: myapp/nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
       - ./code:/data
    networks:
      - app-network

  app:
    build:
      context: ./builds/fpm
      dockerfile: Dockerfile
    image: myapp/php
    container_name: app
    volumes:
       - ./code:/data
    networks:
      - app-network

