version: '3'

services:
  app:
    build:
      context: ./docker/fpm
      dockerfile: Dockerfile
    image: otus-hw11/php
    container_name: app
    volumes:
      - ./app:/var/www
    networks:
      - otus-hw11-network

  redis:
    image: redis:latest
    container_name: otus-hw11-redis
    ports:
      - "6379:6379"
    networks:
      - otus-hw11-network

networks:
  otus-hw11-network:
    driver: bridge
