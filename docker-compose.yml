version: '3.8'

services:
  app:
    image: php:8.2-cli
    container_name: php_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: bash -c "apt-get update && apt-get install -y git unzip && php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\" && php composer-setup.php && php -r \"unlink('composer-setup.php');\" && mv composer.phar /usr/local/bin/composer && composer install && tail -f /dev/null"