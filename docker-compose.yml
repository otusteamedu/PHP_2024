services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otus_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: otus_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${DATABASE_DB}", "-U", "${DATABASE_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/postgresql/data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
