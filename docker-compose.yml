services:
  nginx:
    container_name: MyNginx
    ports:
      - "80:80"
    build:
      context: ./context/nginx
      dockerfile: dockerfile
    networks:
      - devweb
    volumes:
      - ./project/htdocs/:/var/www/html/
      - ./logs/nginx:/var/log/nginx/
    depends_on:
      - php

  php:
    container_name: MyPhp
    build:
      context: ./context/php
      dockerfile: dockerfile
    volumes:
     - ./project/htdocs/:/var/www/html/
     - ./logs/php.log:/var/log/fpm-php.www.log
    networks:
      - devweb

networks:
  devweb:
    name: devweb
    driver: bridge