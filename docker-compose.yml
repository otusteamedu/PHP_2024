services:
  ngnix:
    container_name: MyNgnix
    ports:
      - "80:80"
    build:
      context: ./context/ngnix
      dockerfile: dockerfile
    networks:
      - devweb
    volumes:
      - ./WEB/www/:/var/www/html/
      - ./WEB/www/logs/ngnix:/var/log/ngnix/
    depends_on:
      - php

  php:
    container_name: MyPhp
    build:
      context: ./context/php
      dockerfile: dockerfile
    volumes:
     - ./WEB/www/:/var/www/html/
     - ./WEB/www/logs/php.log:/var/log/fpm-php.www.log
    networks:
      - devweb

networks:
  devweb:
    name: devweb
    driver: bridge