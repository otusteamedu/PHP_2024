services:
  nginx:
    container_name: MyNginx
    ports:
      - "80:80"
    build:
      context: ./context/nginx
      dockerfile: dockerfile
    networks:
      - devweb
    volumes:
      - ./project/htdocs/public_html:/var/www/html/public_html
      - ./logs/nginx:/var/log/nginx/
    depends_on:
      - php

  php:
    container_name: MyPhp
    build:
      context: ./context/php
      dockerfile: dockerfile
    volumes:
     - ./project/htdocs/:/var/www/html/
     - ./logs/php.log:/var/log/fpm-php.www.log
    ports:
      - "38081:38081"  # Новый порт для WebSocket-сервера
    networks:
      - devweb

  postgres:
    container_name: MyPostgres
    image: postgres:16
    env_file:
      - ./context/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devweb

  composer:
    build:
      context: ./context/composer
      dockerfile: Dockerfile
    container_name: MyComposer
    volumes:
      - ./project/htdocs/:/var/www/html
    networks:
      - devweb
    depends_on:
      - php

networks:
  devweb:
    name: devweb
    driver: bridge

volumes:
  postgres_data:
